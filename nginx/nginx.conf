# Single public entrypoint for the whole stack (see CLAUDE.md's Phase 7 deployment
# notes). Path-prefixed so web's API calls are same-origin — no CORS needed for this
# deployment path (CORS is still used/unchanged for the local multi-port `pnpm dev`
# workflow).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;

  # sync-server's internal-only restore endpoint (Phase 7a) must never be reachable
  # from outside Docker's network. Its container port already isn't published to the
  # host, so this is defense in depth: without it, "/sync/" below would happily strip
  # its prefix and forward "/sync/internal/..." straight through to sync-server's
  # internal route. A regex location always wins over a prefix location in Nginx
  # regardless of file order, so this reliably takes priority over the "/sync/" block
  # below — kept first anyway for readability.
  location ~ ^/sync/internal/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # @hocuspocus/provider always strips trailing slashes from its configured url
  # before opening the WebSocket, so the browser's upgrade request path is the bare
  # "/sync" (no trailing slash) — an exact match is needed alongside the prefix match
  # below, otherwise "/sync" alone would fall through to the "/" (web) block instead.
  location = /sync {
    proxy_pass http://sync-server:1234/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  location /sync/ {
    proxy_pass http://sync-server:1234/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hocuspocus WebSocket connections are long-lived; the default proxy_read_timeout
    # would otherwise silently drop idle-but-open editor sessions.
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
